<!DOCTYPE html>

<html lang="da">

<head>
    <title>Projekt 5 - Benedikte Brechmann</title>

    <link rel="stylesheet" href="stylesheet.css">

    <!-- Ikoner fra FontAwesome kit -->

    <!-- Fontfamilie fra Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

<body>
    
    <!-- HEADER -->
    <header class="header">

        <div>
            <i class="icon--click fa-solid fa-bars header--menu-icon" style="color: #e30613;"></i>

        <!-- Logo (center) -->
        <a href="Homepage.html" class="header--logo">
            <img src="img/logo/logo--img.webp" alt="Benedikte Brechmann logo">

        <!-- Søg ikon (højre) -->
        <div>
            <i class="icon--click fa-solid fa-magnifying-glass header--menu-icon" style="color: #e30613;"></i>
        </div>
    </header>

    
    <main>

        <!-- Page header -->
        <div class="page-header">
            <a href="Homepage.html" class="icon--click">

        </div>
        

    </main>


   <!-- BOTTOM NAVIGATION -->
    <footer class="bottom--nav">

        </a>

        <!-- Nav item 2: Hjem (active) -->

            <i class="icon--click fa-regular fa-house bottom--nav-icon" style="color: #e30613;"></i> <br>
            <span class="bottom--nav-text">Hjem</span>
        </a>

        <!-- Nav item 3: Profil -->
        <a href="#" class="bottom--nav-item icon--click">
            <i class="icon--click fa-regular fa-circle-user bottom--nav-icon" style="color: #e30613;"></i> <br>
