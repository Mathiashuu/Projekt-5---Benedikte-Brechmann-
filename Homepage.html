<!DOCTYPE html>

<html lang="da">

<head>
    <title>Projekt 5 - Benedikte Brechmann</title>

    <link rel="stylesheet" href="stylesheet.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Ikoner fra FontAwesome kit -->
    <script src="https://kit.fontawesome.com/611575f0fd.js" crossorigin="anonymous"></script>

    <!-- Fontfamilie fra Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>

<body>
    
    <!-- HEADER -->
    <header class="header">
        <!-- Hamburger menu (venstre) -->
        <div class="header--menu-icon">
            <i class="fa-solid fa-bars icon--click"></i>
        </div>

        <!-- Logo (center) -->
        <div class="header--logo">
            <img src="img/logo/logo--img.webp" alt="Benedikte Brechmann logo">
        </div>

        <!-- Søg ikon (højre) -->
        <div class="header--search-icon">
            <i class="fa-solid fa-magnifying-glass icon--click"></i>
        </div>
    </header>

    <!-- HERO SEKTION MED CAROUSEL -->
    <section class="hero--carousel">
        <!-- Hero slide container -->
        <div class="hero--carousel-slide">
            <!-- hero billede -->
            <img src="img/onboarding-page/onboarding01.webp" alt="">
            
            <!-- Text overlay på billedet-->
            <div class="hero--carousel-content">
                <h1 class="hero--carousel-title">Hvad laver en køberrådgiver?</h1>
                <p class="hero--carousel-subtitle">Lære hvordan vi kan hjælpe dig</p>
            </div>
        </div>

        <!-- status dots -->
       <div class="status-dots1">
                    <span class="dot1 dot-active1"></span>
                    <span class="dot1"></span>
                    <span class="dot1"></span>
                    <span class="dot1"></span>  
                </div>
    </section>

    <!-- BOKSE SEKTION -->
    <section class="bokse">
        
        <!-- Boks 1: Artikler -->
        <a href="#" class="bokse--boks bokse--boks-artikler">
            <div class="bokse--image">
                <img src="img/" alt="Artikler illustration">
            </div>
            <h3 class="bokse--title">Artikler</h3>
        </a>

        <!-- Boks 2: Pakker -->
        <a href="#" class="bokse--boks bokse--boks-pakker">
            <div class="bokse--image">
                <img src="img/" alt="Pakker illustration">
            </div>
            <h3 class="bokse--title">Pakker</h3>
        </a>

        <!-- Boks 3: Booking -->
        <a href="#" class="bokse--boks bokse--boks-booking">
            <div class="bokse--image">
                <img src="img/" alt="Booking illustration">
            </div>
            <h3 class="bokse--title">Booking</h3>
        </a>

        <!-- Boks 4: Info om rådgivning -->
        <a href="#" class="bokse--boks bokse--boks-info">
            <div class="bokse--image">
                <img src="img/" alt="Info om rådgivning illustration">
            </div>
            <h3 class="bokse--title">Info om rådgivning</h3>
        </a>

    </section>

   <!-- BOTTOM NAVIGATION -->
<nav class="bottom--nav">
    
    <!-- Nav item 1: Aftaler -->
    <a href="#" class="bottom--nav-aftaler">
        <i class="fa-regular fa-calendar bottom--nav-item-icon"></i>
        <span class="bottom--nav-aftaler-label">Aftaler</span>
    </a>

    <!-- Nav item 2: Hjem (active) -->
    <a href="#" class="bottom--nav-hjem">
        <i class="fa-solid fa-house bottom--nav-item-icon"></i>
        <span class="bottom--nav-hjem-label">Hjem</span>
    </a>

    <!-- Nav item 3: Profil -->
    <a href="#" class="bottom--nav-profil">
        <i class="fa-regular fa-circle-user bottom--nav-item-icon"></i>
        <span class="bottom--nav-profil-label">Profil</span>
    </a>
    <a>

</nav>

</body>

</html>
