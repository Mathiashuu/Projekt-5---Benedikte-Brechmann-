<!DOCTYPE html>

<html lang="da">

<head>
    <title>Projekt 5 - Benedikte Brechmann</title>

    <link rel="stylesheet" href="stylesheet.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Ikoner fra FontAwesome kit -->
    <script src="https://kit.fontawesome.com/611575f0fd.js" crossorigin="anonymous"></script>

    <!-- Fontfamilie fra Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>

<body>
    
    <!-- HEADER -->
    <header class="header">
        <!-- Hamburger menu (venstre) -->
        <div>
            <i class="icon--click fa-solid fa-bars header--menu-icon" style="color: #e30613;"></i>
        </div>

        <!-- Logo (center) -->
        <a href="Homepage.html" class="header--logo">
            <img src="img/logo/logo--img.webp" alt="Benedikte Brechmann logo">
        </a>

        <!-- Søg ikon (højre) -->
        <div>
            <i class="icon--click fa-solid fa-magnifying-glass header--menu-icon" style="color: #e30613;"></i>
        </div>
    </header>

    <!-- HERO SEKTION MED CAROUSEL -->
    <section class="hero--carousel">

        <!-- Hero slide container -->
        <div class="hero--carousel-slide">
            <!-- hero billede -->
            <img src="img/onboarding-page/onboarding01.webp" alt="Billede af Benedikte og Frederik. Klik her for at lære køberrådgivning">
            
            <!-- Text overlay på billedet-->
            <div class="hero--carousel-content">
                <h1 class="hero--carousel-title">Hvad laver en køberrådgiver?</h1>
                <p class="hero--carousel-subtitle">Lær hvordan vi kan hjælpe dig</p>
            </div>
        </div>

        <!-- status dots -->
       <div class="status-dots1">
            <span class="dot1 dot-active1"></span>
            <span class="dot1"></span>
            <span class="dot1"></span>
            <span class="dot1"></span>  
        </div>
    </section>

    <!-- BOKSE SEKTION -->
    <section class="menu--container">
        
        <!-- EVT "Velkommen tekst" eller "Hvad kan vi hjælpe med i dag" for at opfylde markup validator - Lau -->

        <!-- Boks 1: Artikler -->
        <a href="artikler.html" class="menu--container-item icon--click box--shadow-element">
            <h3 class="menu--container-title">Artikler</h3>
            <img class="menu--container-img" src="img/ikoner/Bolignyt.webp" alt="Klik her for at læse artikler om bolig og rådgivning">  
        </a>

        <!-- Boks 2: Pakker -->
        <a href="pakker.html" class="menu--container-item icon--click box--shadow-element">
            <h3 class="menu--container-title">Vores pakker</h3>
            <img class="menu--container-img" src="img/ikoner/pakke.webp" alt="Klik her for at læse om Benediktes forskellige køberrådgivningspakker">
        </a>

        <!-- Boks 3: Booking -->
        <a href="booking.html" class="menu--container-item icon--click box--shadow-element">
            <h3 class="menu--container-title">Book aftale</h3>
            <img class="menu--container-img" src="img/ikoner/hus.webp" alt="Klik her for at komme ind på Benediktes Bookingside">
        </a>

        <!-- Boks 4: Info om rådgivning -->
        <a href="raedgivning.html" class="menu--container-item icon--click box--shadow-element">
            <h3 class="menu--container-title">Information</h3>
            <img class="menu--container-img" src="img/ikoner/info.webp" alt="Klik her for at læse om info angående rådgivning">
        </a>

    </section>

   <!-- BOTTOM NAVIGATION -->
    <footer class="bottom--nav">
        
        <!-- Nav item 1: Aftaler -->
        <a href="#" class="bottom--nav-item icon--click">
            <i class="icon--click fa-regular fa-calendar bottom--nav-icon" style="color: #e30613;"></i> <br>
            <span class="bottom--nav-text">Aftaler</span>
        </a>

        <!-- Nav item 2: Hjem (active) -->
        <a href="Homepage.html" class="bottom--nav-item icon--click">
            <i class="icon--click fa-regular fa-house bottom--nav-icon" style="color: #e30613;"></i> <br>
            <span class="bottom--nav-text">Hjem</span>
        </a>

        <!-- Nav item 3: Profil -->
        <a href="#" class="bottom--nav-item icon--click">
            <i class="icon--click fa-regular fa-circle-user bottom--nav-icon" style="color: #e30613;"></i> <br>
            <span class="bottom--nav-text">Profil</span>
        </a>

    </footer>

</body>

</html>
