<!DOCTYPE html>

<html lang="da">

<head>
    <title>Projekt 5 - Benedikte Brechmann</title>

    <link rel="stylesheet" href="stylesheet.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Ikoner fra FontAwesome kit -->
    <script src="https://kit.fontawesome.com/611575f0fd.js" crossorigin="anonymous"></script>

    <!-- Fontfamilie fra Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <!-- JavaScript -->
    <script defer src="js/burger.js"></script>
    <script defer src="js/dropdown.js"></script>
    <script defer src="js/booking.js"></script>
    <script defer src="js/onboarding.js"></script>
</head>

<body>
    
    <!-- HEADER -->
    <header class="header">
        <!-- Hamburger menu (venstre) -->
        <div>
            <i class="icon--click fa-solid fa-bars header--menu-icon" style="color: #e30613;"></i>
        </div>

        <!-- Logo (center) -->
        <a href="Homepage.html" class="header--logo">
            <img src="img/logo/logo--img.webp" alt="Benedikte Brechmann logo">
        </a>

        <!-- Søg ikon (højre) -->
        <div>
            <i class="icon--click fa-solid fa-magnifying-glass header--menu-icon" style="color: #e30613;"></i>
        </div>
    </header>

    
    <main id="profile--height">
        <!-- Page header -->
        <div class="page-header">
            <a href="Homepage.html" class="icon--click">
              <i class="fa-solid fa-circle-chevron-left" style="color: #000000; font-size: 24px; padding-left: 20px;"></i>
            </a>
            <h1 class="page-titlev2">Profil</h1>
        </div>  

        <!-- Profilbillede -->
        <div class="profil--image">
            <img src="img/profil-page/sofie.webp" alt="Profilbillede af Sofie Johansen">
        </div>

        <!-- Navn -->
        <h2 class="profil--navn">Sofie Johansen</h2>

        <!-- Menu items -->
        <div class="profil--menu">
            
            <!-- Menu item 1: Profiloplysninger -->
            <a href="#" class="profil--menu-item box--shadow-element">
                <span>Profiloplysninger</span>
                <i class="icon--click fa-solid fa-circle-user" style="color: #1d1d1b;"></i>
            </a>

            <!-- Menu item 2: Aftaler -->
            <a href="aftaler.html" class="profil--menu-item box--shadow-element">
                <span>Aftaler</span>
                <i class="icon--click fa-solid fa-calendar" style="color: #1d1d1b;"></i>
            </a>

            <!-- Menu item 3: Gemte artikler -->
            <a href="#" class="profil--menu-item box--shadow-element">
                <span>Gemte artikler</span>
                <i class="icon--click fa-solid fa-bookmark" style="color: #1d1d1b;"></i>
            </a>

            <!-- Menu item 4: Indstillinger -->
            <a href="#" class="profil--menu-item box--shadow-element">
                <span>Indstillinger</span>
                <i class="icon--click fa-solid fa-gear" style="color: #1d1d1b;"></i>
            </a>

        </div>

        <!-- Log ud knap -->
        <button type="button" class="button button--logOut">Log ud</button>

    </main>


   <!-- BOTTOM NAVIGATION -->
    <footer class="bottom--nav">
        
        <!-- Nav item 1: Aftaler -->
        <a href="aftaler.html" class="bottom--nav-item icon--click">
            <i class="icon--click fa-regular fa-calendar bottom--nav-icon" style="color: #e30613;"></i> <br>
            <span class="bottom--nav-text">Aftaler</span>
        </a>

        <!-- Nav item 2: Hjem (active) -->
        <a href="Homepage.html" class="bottom--nav-item icon--click">
            <i class="icon--click fa-regular fa-house bottom--nav-icon" style="color: #e30613;"></i> <br>
            <span class="bottom--nav-text">Hjem</span>
        </a>

        <!-- Nav item 3: Profil -->
        <a href="profil.html" class="bottom--nav-item icon--click">
            <i class="icon--click fa-solid fa-circle-user bottom--nav-icon" style="color: #e30613;"></i> <br>
            <span class="bottom--nav-text">Profil</span>
        </a>

    </footer>

</body>

</html>
